<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101719" />
    <title>Celestial Academy — Zodiac Odyssey</title>
  </head>
  <body>
    <div id="app">
      <header>
        <a class="brand" href="/"
          ><span class="brand-mark">CA</span>
          <span>CELESTIAL ACADEMY<small>STAR CARTOGRAPHY UNIT</small></span></a
        >
        <div class="header-right">
          <span id="mode-badge"><i></i> OFFLINE</span>
          <button id="ask-ai-button" class="quiet ask-ai-button" hidden>
            ASK AI
          </button>
          <button id="journal-button" class="quiet journal-button">QUEST LOG</button>
          <button id="settings-button" class="quiet">OPTIONS</button>
        </div>
      </header>
      <main>
        <div class="workspace">
          <section class="world-panel">
            <div id="level-hud" aria-label="Current level progress"></div>
            <div id="game" aria-label="Celestial realm exploration game"></div>
            <div class="controls">
              <span><kbd>WASD</kbd> Move</span>
              <span><kbd>E</kbd> Talk</span>
            </div>
          </section>
        </div>
      </main>
    </div>
    <dialog id="overlay" aria-labelledby="modal-title"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
